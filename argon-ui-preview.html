<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Argon UI — Browser preview</title>
<meta name="description" content="Interactive browser preview of the Argon UI Roblox library: all 18 controls, multi-column rows, tooltips, locks, confirmations, notifications, overlays, and all ten themes.">
<link rel="icon" href="argon-ui-logo.svg">
<style>
/* Palette variable names mirror the library's palette keys, so applyTheme can map
   Argon.Themes[name] straight onto CSS custom properties. */
:root{
 --bg:#080a10;--window:#0d1018;--sidebar:#0a0d14;--surface:#131721;--hover:#181d29;--active:#1e2230;
 --input:#0e121b;--border:#2c3141;--soft:#1f2431;--text:#f1f3f9;--muted:#969db1;--dim:#626a80;
 --accent:#9970ff;--accent-light:#c3aaff;--accent-dark:#5c3db8;--success:#4adea2;--warning:#f7be4f;--danger:#ff657c;
 --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --mono:"Cascadia Code",ui-monospace,Consolas,monospace;
 --r:10px;--r-lg:13px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{border:2px solid transparent;border-radius:9px;background:var(--border);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- stage + window chrome ---------------- */
.stage{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;
 background:radial-gradient(900px 520px at 84% 6%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
 radial-gradient(760px 520px at 12% 104%,color-mix(in srgb,var(--accent-dark) 18%,transparent),transparent 70%),
 var(--bg)}
.window{position:relative;width:min(1060px,100%);height:min(700px,calc(100dvh - 44px));min-width:320px;min-height:400px;
 display:grid;grid-template-columns:236px minmax(0,1fr);overflow:hidden;resize:both;
 border:1px solid color-mix(in srgb,var(--border) 82%,transparent);border-radius:18px;
 background:linear-gradient(118deg,color-mix(in srgb,var(--window) 97%,#fff 3%),var(--window));
 box-shadow:0 40px 110px #00000091,inset 0 1px 0 #ffffff0a;animation:arrive .45s cubic-bezier(.2,.8,.2,1)}
@keyframes arrive{from{opacity:0;transform:translateY(14px) scale(.985)}}
.window.away{opacity:0;transform:scale(.99);pointer-events:none;transition:.2s}

/* ---------------- sidebar ---------------- */
.sidebar{position:relative;z-index:2;display:flex;flex-direction:column;min-width:0;padding:16px 11px 11px;
 border-right:1px solid color-mix(in srgb,var(--border) 70%,transparent);background:color-mix(in srgb,var(--sidebar) 84%,transparent);backdrop-filter:blur(22px)}
.brand{display:flex;align-items:center;gap:11px;padding:0 5px}
.brand img{width:36px;height:36px;flex:none;filter:drop-shadow(0 8px 14px color-mix(in srgb,var(--accent) 30%,transparent))}
.brand-copy{min-width:0}
.brand-name{font:750 15px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{margin-top:2px;color:var(--dim);font:800 8.5px/1 var(--sans);letter-spacing:.14em}
.search{display:flex;align-items:center;gap:8px;height:37px;margin:16px 1px 0;padding:0 10px;
 border:1px solid color-mix(in srgb,var(--border) 80%,transparent);border-radius:var(--r);background:var(--input);transition:.17s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.search svg{width:15px;height:15px;flex:none;color:var(--dim)}
.search input{width:100%;min-width:0;border:0;outline:0;background:none;font-size:12.5px}
.search input::placeholder{color:var(--dim)}
.kbd{flex:none;padding:2px 6px;border:1px solid var(--soft);border-radius:5px;color:var(--dim);font:800 9.5px/1.4 var(--mono)}
.nav-title{padding:14px 8px 7px;color:var(--dim);font:800 9px/1 var(--sans);letter-spacing:.14em}
.tabs{display:flex;flex-direction:column;gap:5px;min-height:0;overflow:auto;padding-right:3px}
.tab{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;
 height:42px;padding:0 8px;border-radius:var(--r);color:var(--muted);text-align:left;transition:.16s}
.tab:hover{color:var(--text);background:color-mix(in srgb,var(--hover) 74%,transparent)}
.tab.on{color:var(--text);background:color-mix(in srgb,var(--active) 88%,transparent)}
.tab.on::before{content:"";position:absolute;left:0;top:10px;width:2px;height:22px;border-radius:2px;background:var(--accent);
 box-shadow:0 0 12px color-mix(in srgb,var(--accent) 75%,transparent)}
.tab-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--active) 85%,transparent);transition:.16s}
.tab-icon svg{width:16px;height:16px}
.tab.on .tab-icon{color:#fff;background:var(--accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 32%,transparent)}
.tab-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:650 12.5px/1.2 var(--sans)}
.tab-count{color:var(--dim);font:800 9px/1 var(--mono)}
.side-foot{display:grid;grid-template-columns:26px minmax(0,1fr);gap:9px;align-items:center;margin:11px 1px 0;padding:5px;
 border-radius:var(--r);background:color-mix(in srgb,var(--surface) 82%,transparent)}
.avatar{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;font:800 10px/1 var(--sans);
 background:linear-gradient(135deg,var(--accent-light),var(--accent-dark));color:#fff}
.side-foot .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:650 11px/1.3 var(--sans)}
.side-foot .s{color:var(--success);font:800 8px/1.3 var(--sans);letter-spacing:.09em}

/* ---------------- content ---------------- */
.content{position:relative;z-index:1;min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent)}
.eyebrow{color:var(--accent-light);font:800 8.5px/1 var(--sans);letter-spacing:.13em}
.page-title{margin-top:4px;font:780 20px/1.1 var(--sans);letter-spacing:-.025em}
.top-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
.live{display:flex;align-items:center;gap:7px;height:27px;padding:0 11px;border:1px solid color-mix(in srgb,var(--border) 80%,transparent);
 border-radius:999px;background:color-mix(in srgb,var(--surface) 74%,transparent);color:var(--muted);font:800 8.5px/1 var(--sans);letter-spacing:.08em}
.live i{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 10px color-mix(in srgb,var(--success) 70%,transparent)}
.ibtn{display:grid;place-items:center;width:30px;height:30px;border:1px solid color-mix(in srgb,var(--border) 80%,transparent);
 border-radius:9px;background:color-mix(in srgb,var(--surface) 76%,transparent);color:var(--muted);transition:.15s}
.ibtn:hover{color:var(--text);background:var(--hover)}
.ibtn.on{color:var(--accent-light);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.ibtn svg{width:15px;height:15px}

/* section jump rail */
.jump{display:flex;gap:6px;align-items:center;padding:9px 20px;overflow-x:auto;border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)}
.jump::-webkit-scrollbar{height:0}
.jump b{flex:none;color:var(--dim);font:800 8.5px/1 var(--sans);letter-spacing:.13em}
.chip{flex:none;padding:5px 10px;border:1px solid var(--soft);border-radius:999px;color:var(--muted);font:700 10px/1.3 var(--sans);transition:.14s}
.chip:hover{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

.pages{position:relative;min-height:0}
.page{position:absolute;inset:0;display:none;overflow:auto;padding:16px 20px 26px}
.page.on{display:block;animation:pageIn .2s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(5px)}}
.section{margin-bottom:13px;scroll-margin-top:8px}
.section-head{display:flex;align-items:center;gap:9px;height:30px;color:var(--muted);font:800 9.5px/1 var(--sans);letter-spacing:.1em}
.section-head::before{content:"";width:3px;height:10px;border-radius:3px;background:var(--accent)}
.section-body{display:flex;flex-direction:column;gap:7px;padding:8px;border:1px solid color-mix(in srgb,var(--border) 62%,transparent);
 border-radius:var(--r-lg);background:color-mix(in srgb,var(--bg) 50%,transparent)}
.empty{padding:28px;border:1px dashed var(--border);border-radius:var(--r-lg);color:var(--dim);font-size:12px;text-align:center}

/* Rows: equal columns, stretched to the tallest cell on the line, collapsing as the
   section body narrows. Container queries mean a resized window behaves like a phone,
   which is what MinColumnWidth does in the library. */
.section-body{container-type:inline-size}
.row{display:grid;gap:7px;align-items:stretch;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
.row>.ctl{height:100%}
@container (max-width:620px){.row.cols3,.row.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:420px){.row{grid-template-columns:minmax(0,1fr)}}

/* ---------------- controls ---------------- */
.ctl{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 13px;
 border:1px solid color-mix(in srgb,var(--soft) 95%,transparent);border-radius:var(--r);
 background:color-mix(in srgb,var(--surface) 94%,transparent);transition:border-color .16s,background .16s}
.ctl:hover{border-color:color-mix(in srgb,var(--border) 92%,transparent);background:var(--hover)}
.ctl.stackv{flex-direction:column;align-items:stretch;gap:9px}
.ctl-main{min-width:0;flex:1}
.ctl-name{display:flex;align-items:center;gap:6px;font:650 13px/1.35 var(--sans)}
.ctl-name span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl-desc{margin-top:2px;color:var(--dim);font:400 10px/1.42 var(--sans)}
.ctl-line{display:flex;align-items:center;gap:12px}
.q{flex:none;display:grid;place-items:center;width:14px;height:14px;border-radius:50%;
 background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent-light);font:800 9px/1 var(--sans);cursor:help}

/* toggle */
.tg{position:relative;flex:none;width:44px;height:24px;border-radius:999px;background:var(--input);transition:.2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s}
.tg.on{background:var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 22%,transparent)}
.tg.on::after{left:23px;background:#fff}

/* slider: recessed groove, fill terminating under the knob */
.sl{position:relative;height:16px;margin:2px 0;cursor:pointer;touch-action:none}
.sl-track{position:absolute;left:0;right:0;top:4px;height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--soft)}
.sl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--accent-light),var(--accent))}
.sl-knob{position:absolute;top:0;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);
 box-shadow:0 2px 8px #0009;transition:transform .12s}
.sl:hover .sl-knob,.sl:focus-visible .sl-knob{transform:scale(1.12)}
.val{flex:none;min-width:60px;padding:5px 8px;border:1px solid var(--soft);border-radius:8px;background:var(--input);
 color:var(--accent-light);font:800 10px/1.4 var(--mono);text-align:center}

/* stepper */
.st{display:flex;align-items:center;gap:3px;flex:none;padding:3px;border:1px solid var(--soft);border-radius:9px;background:var(--input)}
.st button{width:26px;height:24px;border-radius:7px;background:var(--surface);color:var(--accent-light);font:800 15px/1 var(--sans)}
.st button:hover{background:var(--accent);color:#fff}
.st span{min-width:54px;text-align:center;font:800 11px/24px var(--mono)}

/* text field + area */
.fld{width:100%;min-width:0;height:34px;padding:0 11px;border:1px solid var(--soft);border-radius:9px;outline:0;
 background:var(--input);font-size:11.5px}
textarea.fld{height:auto;min-height:80px;padding:9px 11px;resize:vertical;line-height:1.5;font-family:var(--mono);font-size:11px}
.fld:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.fld::placeholder{color:var(--dim)}
.meta{color:var(--dim);font:600 9.5px/1 var(--sans)}

/* keybind */
.kb{flex:none;min-width:78px;height:29px;padding:0 10px;border:1px solid var(--soft);border-radius:8px;background:var(--input);
 color:var(--accent-light);font:800 10px/1 var(--sans)}
.kb.listening{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 55%,transparent);animation:pulse 1s infinite alternate}
@keyframes pulse{to{background:color-mix(in srgb,var(--warning) 12%,transparent)}}

/* dropdown */
.dd{position:relative;flex:none;min-width:200px;max-width:100%}
.ctl.stackv .dd{width:100%;min-width:0}
.dd-trigger{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 11px;border:1px solid var(--soft);
 border-radius:9px;background:var(--input);font-size:11.5px;text-align:left;transition:.15s}
.dd-trigger span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-trigger svg{width:14px;height:14px;flex:none;color:var(--dim);transition:.18s}
.dd.open .dd-trigger{border-color:var(--accent);background:var(--hover);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.dd.open .dd-trigger svg{color:var(--accent-light);transform:rotate(180deg)}
.dd-menu{position:absolute;right:0;top:40px;z-index:18;width:max(100%,220px);padding:7px;border:1px solid var(--border);
 border-radius:12px;background:color-mix(in srgb,var(--window) 98%,#000);box-shadow:0 22px 55px #0000007a;animation:pageIn .15s ease-out}
.dd-menu.up{top:auto;bottom:40px}
.dd-filter{width:100%;height:30px;padding:0 9px;border:1px solid var(--soft);border-radius:8px;outline:0;background:var(--input);font-size:10.5px}
.dd-filter:focus{border-color:var(--accent)}
.dd-opts{display:flex;flex-direction:column;gap:3px;max-height:158px;margin-top:6px;overflow:auto}
.dd-opt{display:flex;align-items:center;gap:8px;min-height:31px;padding:0 9px;border-radius:8px;color:var(--muted);
 font-size:10.5px;text-align:left;transition:.13s}
.dd-opt:hover{color:var(--text);background:var(--hover)}
.dd-opt.on{color:var(--accent-light);background:var(--active)}
.dd-opt i{display:grid;place-items:center;width:14px;height:14px;flex:none;border:1px solid var(--soft);border-radius:4px;font-style:normal;font-size:9px}
.dd-opt.on i{border-color:var(--accent);background:var(--accent);color:#fff}
.dd-empty{padding:11px;color:var(--dim);font-size:10px;text-align:center}

/* segmented */
.seg{display:flex;gap:3px;flex:none;padding:3px;border-radius:9px;background:var(--input)}
.ctl.stackv .seg{width:100%}
.seg button{flex:1;padding:7px 11px;border-radius:7px;background:var(--surface);color:var(--muted);
 font:800 9.5px/1.2 var(--sans);letter-spacing:.05em;white-space:nowrap;transition:.14s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}

/* colour picker */
.cp{position:relative;flex:none}
.cp-swatch{width:76px;height:30px;border:1px solid var(--border);border-radius:9px;font:800 9px/1 var(--mono);color:#0006;
 text-shadow:0 1px 0 #ffffff4d}
.cp-pop{position:absolute;right:0;top:38px;z-index:19;width:196px;padding:11px;border:1px solid var(--border);border-radius:12px;
 background:color-mix(in srgb,var(--window) 98%,#000);box-shadow:0 22px 55px #0000007a;animation:pageIn .15s ease-out}
.cp-pop.up{top:auto;bottom:38px}
.cp-sv{position:relative;height:112px;border-radius:9px;cursor:crosshair;touch-action:none}
.cp-hue{position:relative;height:12px;margin-top:9px;border-radius:6px;cursor:pointer;touch-action:none;
 background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cp-dot{position:absolute;width:13px;height:13px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0009;pointer-events:none}
.cp-hue .cp-dot{top:6px;height:16px;width:8px;margin:-8px 0 0 -4px;border-radius:3px}
.cp-hex{width:100%;height:28px;margin-top:9px;padding:0 8px;border:1px solid var(--soft);border-radius:8px;outline:0;
 background:var(--input);font:700 10.5px/1 var(--mono);text-align:center;text-transform:uppercase}

/* button */
.go{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:9px;
 background:color-mix(in srgb,var(--accent) 17%,transparent);color:var(--accent-light);transition:.15s}
.go:hover{background:var(--accent);color:#fff;transform:translateX(2px)}
.go svg{width:15px;height:15px}

/* progress bar */
.pg{height:8px;border-radius:4px;border:1px solid var(--soft);background:var(--bg);overflow:hidden}
.pg>b{display:block;height:100%;width:0;border-radius:4px;background:var(--accent);transition:width .25s ease-out}

/* label + paragraph */
.ctl.info{align-items:flex-start;color:var(--muted);font-size:11px;line-height:1.55}
.info-badge{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:8px;
 background:color-mix(in srgb,var(--accent) 17%,transparent);color:var(--accent-light);font:800 12px/1 var(--sans)}

/* telemetry card */
.tc{display:flex;flex-direction:column;gap:6px;padding:12px 13px}
.tc-head{display:flex;align-items:center;gap:9px}
.tc-head b{flex:1;min-width:0;font:650 12.5px/1.2 var(--sans)}
.pill{flex:none;padding:3px 9px;border-radius:999px;font:800 8.5px/1.5 var(--sans);letter-spacing:.08em;
 background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success)}
.pill.accent{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-light)}
.tc-body{color:var(--muted);font:400 10.5px/1.5 var(--sans)}
.para{color:var(--muted);font:400 10.5px/1.55 var(--sans)}

/* data list */
.list{display:flex;flex-direction:column;gap:5px;max-height:172px;padding:6px;overflow:auto;border:1px solid var(--soft);
 border-radius:var(--r);background:color-mix(in srgb,var(--bg) 55%,transparent)}
.li{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;background:color-mix(in srgb,var(--surface) 90%,transparent)}
.li-main{flex:1;min-width:0}
.li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 11px/1.35 var(--sans)}
.li .d{color:var(--dim);font:400 9px/1.4 var(--sans)}
.act{flex:none;padding:5px 9px;border-radius:7px;font:800 9px/1.3 var(--sans);
 background:color-mix(in srgb,var(--accent) 17%,transparent);color:var(--accent-light);transition:.14s}
.act:hover{background:var(--accent);color:#fff}
.act.warning{background:color-mix(in srgb,var(--warning) 17%,transparent);color:var(--warning)}
.act.warning:hover{background:var(--warning);color:#241800}
.act.danger{background:color-mix(in srgb,var(--danger) 17%,transparent);color:var(--danger)}
.act.danger:hover{background:var(--danger);color:#2a0209}

/* divider + space */
.div{display:flex;align-items:center;gap:11px;padding:7px 3px;color:var(--dim);font:800 9px/1 var(--sans);letter-spacing:.14em}
.div::before,.div::after{content:"";flex:1;height:1px;background:var(--border)}
.div.bare::before{display:none}
.div.bare::after{margin-left:0}
.spacer{height:var(--h,14px)}

/* ---------------- lock ---------------- */
.ctl.locked>*:not(.lock){opacity:.32;pointer-events:none}
.ctl.locked{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.lock{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;height:24px;
 padding:0 9px 0 7px;border:1px solid color-mix(in srgb,var(--warning) 48%,transparent);border-radius:8px;
 background:color-mix(in srgb,var(--warning) 15%,transparent);color:var(--warning);font:800 9px/1 var(--sans);
 letter-spacing:.05em;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden}
.lock svg{width:12px;height:12px;flex:none}
.lock.icon{padding:0;width:26px;justify-content:center}

/* ---------------- tooltip ---------------- */
.tip{position:fixed;z-index:60;max-width:280px;padding:8px 11px 9px 13px;border:1px solid var(--border);border-radius:9px;
 background:color-mix(in srgb,var(--window) 98%,#000);color:var(--muted);font:500 10.5px/1.5 var(--sans);
 box-shadow:0 18px 44px #00000080;opacity:0;transform:translateY(3px);transition:opacity .14s,transform .14s;pointer-events:none}
.tip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:9px 0 0 9px;background:var(--accent)}
.tip.on{opacity:1;transform:none}

/* ---------------- overlays ---------------- */
.ov{position:fixed;z-index:28;width:262px;overflow:hidden;border:1px solid color-mix(in srgb,var(--border) 80%,transparent);
 border-radius:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--surface) 96%,transparent),color-mix(in srgb,var(--sidebar) 97%,transparent));
 box-shadow:0 24px 60px #0000006e;backdrop-filter:blur(20px);animation:ovIn .4s .15s both cubic-bezier(.2,.8,.2,1)}
@keyframes ovIn{from{opacity:0;transform:translateX(16px)}}
.ov-head{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:center;height:44px;padding:0 10px;
 border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);cursor:grab}
.ov-head:active{cursor:grabbing}
.ov-icon{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;
 background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-light)}
.ov-icon svg{width:15px;height:15px}
.ov-title{font:800 10.5px/1.2 var(--sans)}
.ov-meta{margin-top:2px;color:var(--dim);font:800 8px/1.2 var(--sans);letter-spacing:.08em}
.ov-grip{color:var(--dim)}
.ov-grip svg{width:13px;height:13px}
.ov-body{display:flex;flex-direction:column;gap:5px;max-height:196px;padding:8px;overflow:auto}
.ov-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:9px;
 background:color-mix(in srgb,var(--surface) 84%,transparent)}
.ov-row.bind{grid-template-columns:7px minmax(0,1fr) auto;height:34px}
.ov-av{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--active);color:var(--accent-light);font:800 9px/1 var(--sans)}
.ov-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:750 10px/1.3 var(--sans)}
.ov-s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font:400 9px/1.3 var(--sans)}
.ov-tag{padding:4px 8px;border-radius:7px;background:color-mix(in srgb,var(--accent) 17%,transparent);color:var(--accent-light);font:800 8px/1.3 var(--sans)}
.ov-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 9px color-mix(in srgb,var(--success) 45%,transparent)}

/* ---------------- theme picker ---------------- */
.themes{position:fixed;z-index:32;width:260px;padding:11px;border:1px solid var(--border);border-radius:14px;
 background:color-mix(in srgb,var(--window) 98%,#000);box-shadow:0 26px 64px #00000085;animation:pageIn .16s ease-out}
.themes h6{margin:0 0 9px;color:var(--dim);font:800 9px/1 var(--sans);letter-spacing:.14em}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.theme-btn{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--soft);border-radius:9px;
 color:var(--muted);font:700 10.5px/1.2 var(--sans);text-align:left;transition:.14s}
.theme-btn:hover{color:var(--text);border-color:var(--accent)}
.theme-btn.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.dots{display:flex;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;border:1px solid #0006}
.dots i+i{margin-left:-3px}

/* ---------------- dialog + toasts ---------------- */
.scrim{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:#00000091;
 backdrop-filter:blur(5px);animation:pageIn .18s ease-out}
.dlg{width:min(410px,100%);padding:19px 21px 17px;border:1px solid var(--border);border-radius:15px;background:var(--window);
 box-shadow:0 30px 84px #0000008f}
.dlg h4{margin:0;font:750 16px/1.3 var(--sans)}
.dlg p{margin:9px 0 0;color:var(--muted);font-size:11.5px;line-height:1.6}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn{height:34px;padding:0 15px;border:1px solid var(--soft);border-radius:9px;background:var(--surface);color:var(--muted);
 font:800 10.5px/1 var(--sans);transition:.15s}
.btn:hover{color:var(--text);border-color:var(--border)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.btn.danger{border-color:var(--danger);background:var(--danger);color:#2a0209}
.btn.primary:hover,.btn.danger:hover{filter:brightness(1.08);color:#fff}
.toasts{position:fixed;right:20px;top:20px;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) 16px;gap:10px;width:min(330px,calc(100vw - 30px));
 overflow:hidden;padding:13px;border:1px solid var(--border);border-radius:13px;background:color-mix(in srgb,var(--window) 98%,#000);
 box-shadow:0 22px 55px #00000075;animation:toastIn .24s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(15px) scale(.98)}}
.toast.out{animation:toastOut .2s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(18px)}}
.toast-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;
 background:color-mix(in srgb,var(--tone,var(--accent)) 17%,transparent);color:var(--tone,var(--accent-light))}
.toast-icon svg{width:16px;height:16px}
.toast .t{font:800 12.5px/1.3 var(--sans)}
.toast .b{margin-top:3px;color:var(--muted);font:400 10.5px/1.45 var(--sans)}
.toast .x{color:var(--dim);font-size:13px;line-height:1}
.toast .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--tone,var(--accent));animation:drain 4.2s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}

/* ---------------- splash ---------------- */
.splash{position:absolute;inset:0;z-index:45;display:grid;place-items:center;overflow:hidden;
 background:radial-gradient(circle at 68% 20%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 40%),
 linear-gradient(125deg,var(--surface),var(--bg));animation:splashOut .34s 1.45s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden;transform:scale(1.02)}}
.loader{width:min(360px,calc(100% - 32px));padding:26px 30px;border:1px solid color-mix(in srgb,var(--border) 80%,transparent);
 border-radius:20px;text-align:center;background:color-mix(in srgb,var(--surface) 76%,transparent);
 box-shadow:0 30px 88px #00000080;backdrop-filter:blur(20px);animation:pageIn .5s cubic-bezier(.2,.8,.2,1)}
.orbit{position:relative;display:grid;place-items:center;width:104px;height:104px;margin:auto;
 border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:50%;animation:spin 1.8s linear infinite}
.orbit::before{content:"";position:absolute;left:50%;top:0;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
 background:var(--accent-light);box-shadow:0 0 16px var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit img{width:58px;height:58px;animation:spin 1.8s linear infinite reverse}
.loader h3{margin:18px 0 0;font:800 18px/1.2 var(--sans)}
.loader .st1{margin-top:5px;color:var(--accent-light);font:800 8.5px/1 var(--sans);letter-spacing:.13em}
.loader .st2{margin-top:7px;overflow:hidden;color:var(--dim);font-size:10px;white-space:nowrap;text-overflow:ellipsis}
.rail{height:6px;margin-top:19px;overflow:hidden;border-radius:999px;background:var(--input)}
.rail>b{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent-light),var(--accent-dark));
 animation:fill 1.2s .06s forwards cubic-bezier(.2,.8,.2,1)}
@keyframes fill{to{width:100%}}
.pct{margin-top:7px;color:var(--muted);font:800 9px/1 var(--mono);text-align:right}

/* ---------------- help bar ---------------- */
.help{position:fixed;left:50%;bottom:14px;z-index:26;display:flex;align-items:center;gap:10px;
 transform:translateX(-50%);padding:7px 13px;border:1px solid color-mix(in srgb,var(--border) 70%,transparent);
 border-radius:999px;background:color-mix(in srgb,var(--window) 88%,transparent);backdrop-filter:blur(14px);
 color:var(--dim);font:600 10.5px/1 var(--sans);white-space:nowrap;box-shadow:0 12px 30px #00000059}
.help span{display:flex;align-items:center;gap:5px}
.help a{color:var(--accent-light);text-decoration:none}
.help a:hover{text-decoration:underline}
.help .close{color:var(--dim);font-size:13px;line-height:1}

/* Below this width the floating overlays would sit on top of the window rather than
   beside it, so they step aside instead of covering the controls. */
@media(max-width:1320px){.ov{display:none}}
@media(max-width:820px){
 .window{grid-template-columns:68px minmax(0,1fr)}
 .brand-copy,.search,.nav-title,.tab-name,.tab-count,.side-foot .c{display:none}
 .tabs{margin-top:14px}
 .tab{grid-template-columns:28px;justify-content:center;padding:0 6px}
 .side-foot{grid-template-columns:26px;justify-content:center;padding:5px 8px}
 .live{display:none}
 .topbar,.jump,.page{padding-inline:15px}
 .dd{min-width:150px}
}
@media(max-width:560px){
 .stage{padding:0}
 .window{width:100vw;height:100dvh;min-height:0;border:0;border-radius:0;resize:none}
 .page-title{font-size:17px}
 .toasts{right:10px;top:10px}
 .help{bottom:8px;font-size:10px;padding:6px 10px}
 .help .hide-sm{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
  <section class="window" id="win">

          <button class="ibtn on" id="pinBtn" title="Pin overlays" aria-label="Pin overlays"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 10.8V4h6v6.8l2 3.2H7l2-3.2z"/></svg></button>
          <button class="ibtn" id="notifyBtn" title="Preview a notification" aria-label="Preview a notification"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg></button>
          <button class="ibtn" id="hideBtn" title="Hide the interface (Insert)" aria-label="Hide the interface"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        </div>

      <div class="pages" id="pages"></div>
    </section>
    <div class="splash" id="splash">

        <div class="orbit"><img src="argon-ui-logo.svg" alt=""></div>

        <div class="st2" id="ldDetail">Mounting interface shell</div>
        <div class="rail"><b></b></div>

      </div>
    </div>
  </section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

  <span><span class="kbd">Insert</span> hide</span>
  <span class="hide-sm"><span class="kbd">Esc</span> close</span>
  <span class="hide-sm"><a href="https://jirkaachs.github.io/argon-ui/">Documentation</a></span>
  <button class="close" id="helpClose" aria-label="Dismiss">×</button>
</div>
<script>
/* =========================================================================
   Argon UI browser preview
   A faithful static reimplementation of the library's interface in HTML, so the

   palettes below are generated from argon-ui.luau so they cannot drift.
   ========================================================================= */

const THEMES = {

  Midnight:{Background:"#06090f",Window:"#0a0e17",Sidebar:"#070b12",Surface:"#101622",Hover:"#151d2c",Active:"#1b2436",Input:"#0a0f19",Border:"#2a3548",BorderSoft:"#1c2534",Text:"#eef4ff",Muted:"#929fb5",Dim:"#57657e",Accent:"#58a6ff",AccentLight:"#9bcdff",AccentDark:"#235bb4",Success:"#4cdca6",Warning:"#f7be4f",Danger:"#ff657c"},

  Slate:{Background:"#0b0d10",Window:"#111419",Sidebar:"#0d1014",Surface:"#191d24",Hover:"#21262f",Active:"#2a303b",Input:"#13171d",Border:"#3a4250",BorderSoft:"#262c37",Text:"#eef3f9",Muted:"#9aa6b6",Dim:"#677282",Accent:"#7dc4ff",AccentLight:"#badeff",AccentDark:"#3478ba",Success:"#55d69e",Warning:"#f0be60",Danger:"#f87185"},
  Ember:{Background:"#100907",Window:"#180e0a",Sidebar:"#130b08",Surface:"#23140f",Hover:"#2e1a13",Active:"#3a2118",Input:"#1b0f0b",Border:"#533123",BorderSoft:"#382118",Text:"#fff1e9",Muted:"#c4a392",Dim:"#8c6e5f",Accent:"#ff8a4c",AccentLight:"#ffbe96",AccentDark:"#be4a1a",Success:"#5edca0",Warning:"#fcc45c",Danger:"#ff6969"},
  Nord:{Background:"#1f2430",Window:"#292e3d",Sidebar:"#242936",Surface:"#343a4a",Hover:"#3e4658",Active:"#495266",Input:"#2c3241",Border:"#576176",BorderSoft:"#3f4758",Text:"#eceff4",Muted:"#b1bbc9",Dim:"#7e8a9c",Accent:"#88c0d0",AccentLight:"#bee0e8",AccentDark:"#4c8498",Success:"#a3be8c",Warning:"#ebcb8b",Danger:"#bf616a"},
  Mono:{Background:"#0a0a0b",Window:"#101012",Sidebar:"#0d0d0e",Surface:"#18181b",Hover:"#202024",Active:"#29292e",Input:"#121214",Border:"#3a3a40",BorderSoft:"#26262a",Text:"#f4f4f6",Muted:"#9f9fa8",Dim:"#6c6c76",Accent:"#e2e2e8",AccentLight:"#ffffff",AccentDark:"#8c8c96",Success:"#78d6aa",Warning:"#e8c478",Danger:"#f47886"},

};
const THEME_NAMES = Object.keys(THEMES);

const ICONS = {
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  swords:'<polyline points="14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><polyline points="14.5 6.5 18 3h3v3l-11.5 11.5"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',

  database:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>',
  settings:'<path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7V20a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  chevron:'<path d="m6 9 6 6 6-6"/>',
  arrow:'<path d="M5 12h13"/><path d="m12 5 7 7-7 7"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
  keyboard:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/>'
};
const icon = (name, stroke) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
  (stroke || 1.9) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  (ICONS[name] || ICONS.activity) + '</svg>';
const escape = value => String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ------------------------------- content ------------------------------- */
const TABS = [
  { id:'dashboard', name:'Dashboard', icon:'activity', sections:[

/* ------------------------------- rendering ------------------------------- */
const $ = selector => document.querySelector(selector);
const tabsEl = $('#tabs'), pagesEl = $('#pages'), jumpEl = $('#jump'), searchEl = $('#search'), winEl = $('#win');
const state = { tab:TABS[0].id, hidden:false, theme:'Argon', pinned:true };

const head = item => {
  const marker = item.tip ? '<span class="q" aria-hidden="true">?</span>' : '';
  const desc = item.desc ? '<div class="ctl-desc">' + escape(item.desc) + '</div>' : '';
  return '<div class="ctl-main"><div class="ctl-name"><span>' + escape(item.name) + '</span>' + marker +
    '</div>' + desc + '</div>';
};
const lockBadge = reason => '<span class="lock" data-reason="' + escape(reason) + '">' + icon('lock', 2.2) +
  '<b class="lk">' + escape(reason) + '</b></span>';

function control(item) {
  const key = escape([item.name, item.title, item.desc, item.text].filter(Boolean).join(' '));
  const attrs = ' data-search="' + key + '"' + (item.tip ? ' data-tip="' + escape(item.tip) + '"' : '') +
    (item.act ? ' data-act="' + item.act + '"' : '');
  const cls = extra => 'class="ctl' + (extra ? ' ' + extra : '') + (item.lock ? ' locked' : '') + '"';
  const lock = item.lock ? lockBadge(item.lock) : '';

  switch (item.t) {
    case 'toggle':
      return '<div ' + cls() + attrs + '>' + head(item) + '<button class="tg' + (item.on ? ' on' : '') +
        '" role="switch" aria-checked="' + !!item.on + '" aria-label="' + escape(item.name) + '"></button>' + lock + '</div>';

    case 'slider':
      return '<div ' + cls('stackv') + attrs + ' data-min="' + item.min + '" data-max="' + item.max +
        '" data-step="' + (item.step || 1) + '" data-suffix="' + escape(item.suffix || '') + '" data-value="' + item.value + '">' +
        '<div class="ctl-line">' + head(item) + '<span class="val"></span></div>' +
        '<div class="sl" role="slider" tabindex="0" aria-label="' + escape(item.name) + '" aria-valuemin="' + item.min +
        '" aria-valuemax="' + item.max + '"><div class="sl-track"><div class="sl-fill"></div></div><div class="sl-knob"></div></div>' +
        lock + '</div>';

    case 'stepper':
      return '<div ' + cls() + attrs + ' data-min="' + item.min + '" data-max="' + item.max + '" data-step="' + item.step +
        '" data-suffix="' + escape(item.suffix || '') + '" data-value="' + item.value + '">' + head(item) +
        '<div class="st"><button data-dir="-1" aria-label="Decrease ' + escape(item.name) + '">\u2212</button>' +
        '<span class="stv"></span><button data-dir="1" aria-label="Increase ' + escape(item.name) + '">+</button></div>' +
        lock + '</div>';

    case 'input':
      return '<div ' + cls('stackv') + attrs + '><div class="ctl-line">' + head(item) + '</div>' +
        '<input class="fld" value="' + escape(item.value || '') + '" placeholder="' + escape(item.ph || '') +
        '" aria-label="' + escape(item.name) + '">' + lock + '</div>';

    case 'textarea':
      return '<div ' + cls('stackv') + attrs + '><div class="ctl-line">' + head(item) +
        '<span class="meta"></span></div><textarea class="fld" placeholder="' + escape(item.ph || '') +
        '" aria-label="' + escape(item.name) + '">' + escape(item.value || '') + '</textarea>' + lock + '</div>';

    case 'keybind':
      return '<div ' + cls() + attrs + '>' + head(item) + '<button class="kb">' + escape(item.key) + '</button>' + lock + '</div>';

    case 'dropdown': {
      const options = item.options.map(option =>
        '<button class="dd-opt' + (item.value.includes(option) ? ' on' : '') + '" data-value="' + escape(option) + '">' +
        (item.multi ? '<i>\u2713</i>' : '') + '<span>' + escape(option) + '</span></button>').join('');
      return '<div ' + cls() + attrs + '>' + head(item) + '<div class="dd" data-multi="' + !!item.multi + '">' +
        '<button class="dd-trigger"><span></span>' + icon('chevron') + '</button>' +
        '<div class="dd-menu hidden"><input class="dd-filter" placeholder="Filter options…" aria-label="Filter options">' +
        '<div class="dd-opts">' + options + '</div><div class="dd-empty hidden">No match</div></div></div>' + lock + '</div>';
    }

    case 'segmented':
      return '<div ' + cls('stackv') + attrs + '><div class="ctl-line">' + head(item) + '</div><div class="seg">' +
        item.options.map(option => '<button' + (option === item.value ? ' class="on"' : '') + '>' + escape(option) +
          '</button>').join('') + '</div>' + lock + '</div>';

    case 'color':
      return '<div ' + cls() + attrs + '>' + head(item) + '<div class="cp" data-value="' + escape(item.value) +
        '"><button class="cp-swatch" aria-label="' + escape(item.name) + '"></button></div>' + lock + '</div>';

    case 'button':
      return '<div ' + cls() + attrs + '>' + head(item) + '<button class="go" aria-label="' + escape(item.name) + '">' +
        icon('arrow') + '</button>' + lock + '</div>';

    case 'progress':
      return '<div ' + cls('stackv') + attrs + ' data-value="' + item.value + '" data-max="' + item.max + '">' +
        '<div class="ctl-line">' + head(item) + '<span class="val"></span></div><div class="pg"><b></b></div>' + lock + '</div>';

    case 'list':
      return '<div ' + cls('stackv') + attrs + '><div class="ctl-line">' + head(item) +
        '<span class="meta">' + item.items.length + ' items</span></div><div class="list">' +
        item.items.map(row => '<div class="li"><div class="li-main"><div class="n">' + escape(row.title) + '</div>' +
          (row.desc ? '<div class="d">' + escape(row.desc) + '</div>' : '') + '</div>' +
          (row.actions || []).map(action => '<button class="act' + (action.style ? ' ' + action.style : '') +
            '" data-row="' + escape(row.title) + '">' + escape(action.label) + '</button>').join('') + '</div>').join('') +
        '</div></div>';

    case 'card':
      return '<div class="ctl tc" data-search="' + key + '"><div class="tc-head"><b>' + escape(item.title) +
        '</b><span class="pill' + (item.tone === 'accent' ? ' accent' : '') + '">' + escape(item.status) +
        '</span></div><div class="tc-body">' + escape(item.body) + '</div></div>';

    case 'label':
      return '<div class="ctl info" data-search="' + escape(item.text) + '"><span class="info-badge">i</span><div>' +
        escape(item.text) + '</div></div>';

    case 'paragraph':
      return '<div class="ctl stackv" data-search="' + key + '"><div class="ctl-line">' + head(item) +
        '</div><div class="para">' + escape(item.text) + '</div></div>';

    case 'divider':
      return '<div class="div">' + escape(item.text || '') + '</div>';

    case 'space':
      return '<div class="spacer" style="--h:' + (item.h || 14) + 'px"></div>';

    default:
      return '';
  }
}

const renderItem = item => item.t === 'row'
  ? '<div class="row cols' + item.items.length + '" style="--cols:' + item.items.length + '">' +
    item.items.map(control).join('') + '</div>'
  : control(item);

function build() {
  tabsEl.innerHTML = TABS.map(tab => {
    const count = tab.sections.reduce((total, section) => total + section.items.reduce((sum, item) =>
      sum + (item.t === 'row' ? item.items.length : 1), 0), 0);
    return '<button class="tab" data-tab="' + tab.id + '"><span class="tab-icon">' + icon(tab.icon) +
      '</span><span class="tab-name">' + escape(tab.name) + '</span><span class="tab-count">' + count + '</span></button>';
  }).join('');

  pagesEl.innerHTML = TABS.map(tab => '<div class="page" id="page-' + tab.id + '">' +
    tab.sections.map((section, index) => '<div class="section" id="sec-' + tab.id + '-' + index + '">' +
      '<div class="section-head">' + escape(section.name) + '</div><div class="section-body">' +
      section.items.map(renderItem).join('') + '</div></div>').join('') +
    '<div class="empty hidden">Nothing on this tab matches that search.</div></div>').join('');

  pagesEl.querySelectorAll('.ctl').forEach(paint);
  pagesEl.querySelectorAll('.dd').forEach(paintDropdown);
  pagesEl.querySelectorAll('.cp').forEach(paintSwatch);
  pagesEl.querySelectorAll('textarea.fld').forEach(countLines);
  pagesEl.querySelectorAll('.ctl.locked').forEach(ctl => { fitLock(ctl.querySelector('.lock')); lockObserver.observe(ctl); });
}

/* ---------------------------- value painting ---------------------------- */
const decimals = step => (String(step).split('.')[1] || '').length;
const snap = (value, step) => Number((Math.round(value / step) * step).toFixed(decimals(step)));
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

function paint(ctl) {
  const slider = ctl.querySelector('.sl');
  if (slider) {
    const min = +ctl.dataset.min, max = +ctl.dataset.max, value = +ctl.dataset.value;
    const ratio = max === min ? 0 : (value - min) / (max - min);
    ctl.querySelector('.val').textContent = value + ctl.dataset.suffix;
    ctl.querySelector('.sl-knob').style.left = 'calc(' + ratio + ' * (100% - 16px))';
    ctl.querySelector('.sl-fill').style.width = 'calc(' + ratio + ' * (100% - 16px) + 8px)';
    slider.setAttribute('aria-valuenow', value);
    return;
  }
  const stepper = ctl.querySelector('.stv');
  if (stepper) { stepper.textContent = ctl.dataset.value + ctl.dataset.suffix; return; }
  const fill = ctl.querySelector('.pg > b');
  if (fill) {
    const value = +ctl.dataset.value, max = +ctl.dataset.max;
    fill.style.width = clamp(value / max * 100, 0, 100) + '%';
    fill.style.background = value >= max ? 'var(--success)' : 'var(--accent)';
    ctl.querySelector('.val').textContent = value + ' / ' + max;
  }
}

function paintDropdown(dd) {
  const chosen = [...dd.querySelectorAll('.dd-opt.on')].map(option => option.dataset.value);
  dd.querySelector('.dd-trigger > span').textContent = dd.dataset.multi === 'true'
    ? (chosen.length === 0 ? 'None selected' : chosen.length === 1 ? chosen[0] : chosen.length + ' selected')
    : (chosen[0] || 'None');
}

function countLines(area) {
  const lines = area.value.split('\n').filter(line => line.trim()).length;
  const meta = area.closest('.ctl').querySelector('.meta');
  if (meta) meta.textContent = lines + (lines === 1 ? ' line · ' : ' lines · ') + area.value.length + ' chars';
}

/* A lock badge collapses from the full reason, to LOCKED, to the padlock alone.
   Every pass re-derives from data-reason, so tiers cannot oscillate. */
function fitLock(badge) {
  if (!badge) return;
  const label = badge.querySelector('.lk');
  badge.classList.remove('icon');
  label.hidden = false;
  label.textContent = badge.dataset.reason;
  if (badge.scrollWidth > badge.clientWidth + 1) {
    label.textContent = 'LOCKED';
    if (badge.scrollWidth > badge.clientWidth + 1) { badge.classList.add('icon'); label.hidden = true; }
  }
}
const lockObserver = new ResizeObserver(entries =>
  entries.forEach(entry => fitLock(entry.target.querySelector('.lock'))));

/* -------------------------------- colour -------------------------------- */
const hsvToRgb = (h, s, v) => {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  const table = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]];
  const [r, g, b] = table[Math.floor((h % 360) / 60)];
  return [r + m, g + m, b + m].map(channel => Math.round(channel * 255));
};
const toHex = ([r, g, b]) => '#' + [r, g, b].map(channel =>
  channel.toString(16).padStart(2, '0')).join('');
function hexToHsv(hex) {
  const value = hex.replace('#', '');
  const [r, g, b] = [0, 2, 4].map(offset => parseInt(value.substr(offset, 2), 16) / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), delta = max - min;
  let h = 0;
  if (delta) {
    if (max === r) h = 60 * (((g - b) / delta) % 6);
    else if (max === g) h = 60 * ((b - r) / delta + 2);
    else h = 60 * ((r - g) / delta + 4);
  }
  return [(h + 360) % 360, max ? delta / max : 0, max];
}
const readable = hex => {
  const value = hex.replace('#', '');
  const [r, g, b] = [0, 2, 4].map(offset => parseInt(value.substr(offset, 2), 16));
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#0b0d12' : '#ffffff';
};
function paintSwatch(picker) {
  const hex = picker.dataset.value.toUpperCase();
  const swatch = picker.querySelector('.cp-swatch');
  swatch.style.background = hex;
  swatch.style.color = readable(hex);
  swatch.style.textShadow = 'none';
  swatch.textContent = hex;
}

/* ------------------------------ notifications ------------------------------ */
const toastsEl = $('#toasts');
function notify(title, body) {
  const lower = title.toLowerCase();
  const tone = /error|fail/.test(lower) ? 'danger' : /warn|wait|locked/.test(lower) ? 'warning'
    : /saved|success|complete|ready|done/.test(lower) ? 'success' : 'accent';
  const glyph = tone === 'danger' ? 'alert' : tone === 'success' ? 'check' : tone === 'warning' ? 'alert' : 'bell';
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.setProperty('--tone', 'var(--' + tone + ')');
  toast.innerHTML = '<span class="toast-icon">' + icon(glyph, 2) + '</span><div><div class="t">' + escape(title) +
    '</div><div class="b">' + escape(body) + '</div></div><button class="x" aria-label="Dismiss">×</button>' +
    '<span class="bar"></span>';
  const dismiss = () => { toast.classList.add('out'); setTimeout(() => toast.remove(), 220); };
  toast.querySelector('.x').addEventListener('click', dismiss);
  toastsEl.appendChild(toast);
  setTimeout(dismiss, 4200);
  while (toastsEl.children.length > 4) toastsEl.firstElementChild.remove();
}

/* --------------------------------- dialog --------------------------------- */
function dialog({ title, body, confirmText = 'Confirm', cancelText = 'Cancel', danger = false, onConfirm }) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h4>' + escape(title) + '</h4><p>' +
    escape(body) + '</p><div class="dlg-foot"><button class="btn" data-cancel>' + escape(cancelText) +
    '</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-confirm>' + escape(confirmText) +
    '</button></div></div>';
  document.body.appendChild(scrim);
  let settled = false;
  const close = () => { if (!settled) { settled = true; scrim.remove(); } };
  scrim.querySelector('[data-cancel]').addEventListener('click', close);
  scrim.querySelector('[data-confirm]').addEventListener('click', () => {
    if (settled) return;
    close();
    if (onConfirm) onConfirm();
  });
  scrim.addEventListener('click', event => { if (event.target === scrim) close(); });
  scrim.querySelector('[data-cancel]').focus();
  openDialogs.push(close);
}
const openDialogs = [];

/* --------------------------------- themes --------------------------------- */
function applyTheme(name) {
  const palette = THEMES[name];
  if (!palette) return;
  const style = document.documentElement.style;
  const map = { Background:'bg', BorderSoft:'soft', AccentLight:'accent-light', AccentDark:'accent-dark' };
  Object.entries(palette).forEach(([key, value]) =>
    style.setProperty('--' + (map[key] || key.toLowerCase()), value));
  state.theme = name;
  document.querySelectorAll('.theme-btn').forEach(button =>
    button.classList.toggle('on', button.dataset.theme === name));
  pagesEl.querySelectorAll('.dd').forEach(dd => {
    if (dd.closest('.ctl').dataset.act !== 'theme') return;
    dd.querySelectorAll('.dd-opt').forEach(option => option.classList.toggle('on', option.dataset.value === name));
    paintDropdown(dd);
  });
}

function toggleThemePanel() {

  const anchor = $('#themeBtn').getBoundingClientRect();
  themePanel = document.createElement('div');
  themePanel.className = 'themes';
  themePanel.innerHTML = '<h6>THEMES</h6><div class="theme-grid">' + THEME_NAMES.map(name => {
    const palette = THEMES[name];
    return '<button class="theme-btn' + (name === state.theme ? ' on' : '') + '" data-theme="' + name + '">' +
      '<span class="dots"><i style="background:' + palette.Accent + '"></i><i style="background:' + palette.Surface +
      '"></i><i style="background:' + palette.Background + '"></i></span>' + name + '</button>';
  }).join('') + '</div>';
  document.body.appendChild(themePanel);
  themePanel.style.top = Math.round(anchor.bottom + 8) + 'px';
  themePanel.style.left = Math.round(Math.min(anchor.right - themePanel.offsetWidth, innerWidth - themePanel.offsetWidth - 12)) + 'px';
  themePanel.addEventListener('click', event => {
    const button = event.target.closest('.theme-btn');
    if (!button) return;
    applyTheme(button.dataset.theme);
    notify('Theme changed', button.dataset.theme + ' is now active across every control.');
  });
}
const closeThemePanel = () => { if (themePanel) { themePanel.remove(); themePanel = null; } };

/* -------------------------------- tooltip -------------------------------- */
const tipEl = document.createElement('div');
tipEl.className = 'tip';
document.body.appendChild(tipEl);
let tipTimer = 0, tipHost = null;

function showTip(host) {
  tipEl.textContent = host.dataset.tip;
  tipEl.style.left = '0px';
  tipEl.style.top = '0px';
  tipEl.classList.add('on');
  const rect = host.getBoundingClientRect(), tip = tipEl.getBoundingClientRect();
  const gap = 10, pad = 8;
  let left = rect.right + gap, top = rect.top + rect.height / 2 - tip.height / 2;
  if (left + tip.width > innerWidth - pad) left = rect.left - tip.width - gap;
  if (left < pad) {
    left = clamp(rect.left, pad, innerWidth - tip.width - pad);
    top = rect.bottom + gap;
    if (top + tip.height > innerHeight - pad) top = rect.top - tip.height - gap;
  }
  tipEl.style.left = Math.round(left) + 'px';
  tipEl.style.top = Math.round(clamp(top, pad, innerHeight - tip.height - pad)) + 'px';
  tipHost = host;
}
const hideTip = () => { clearTimeout(tipTimer); tipEl.classList.remove('on'); tipHost = null; };

document.addEventListener('pointerover', event => {
  const host = event.target.closest('.ctl[data-tip]');
  if (host === tipHost) return;
  clearTimeout(tipTimer);
  if (!host) { hideTip(); return; }
  tipTimer = setTimeout(() => showTip(host), 280);
});
document.addEventListener('pointerdown', hideTip, true);

/* -------------------------------- controls -------------------------------- */
const nameOf = ctl => ctl.querySelector('.ctl-name span')?.textContent || 'Control';

function closeDropdowns(except) {
  document.querySelectorAll('.dd.open').forEach(dd => {
    if (dd === except) return;
    dd.classList.remove('open');
    const menu = dd.querySelector('.dd-menu');
    menu.classList.add('hidden');
    menu.classList.remove('up');
    dd.querySelector('.dd-filter').value = '';
    dd.querySelectorAll('.dd-opt').forEach(option => option.classList.remove('hidden'));
    dd.querySelector('.dd-empty').classList.add('hidden');
  });
}
const closePickers = except => document.querySelectorAll('.cp-pop').forEach(pop => {
  if (pop.parentElement !== except) pop.remove();
});

document.addEventListener('click', event => {
  const target = event.target;

  if (!target.closest('.dd')) closeDropdowns();
  if (!target.closest('.cp')) closePickers();
  if (!target.closest('.themes') && !target.closest('#themeBtn')) closeThemePanel();

  const tab = target.closest('.tab');
  if (tab) { activate(tab.dataset.tab); return; }

  const chip = target.closest('.chip');
  if (chip) { $('#' + chip.dataset.target)?.scrollIntoView({ behavior:'smooth', block:'start' }); return; }

  const toggle = target.closest('.tg');
  if (toggle) {
    const on = toggle.classList.toggle('on');
    toggle.setAttribute('aria-checked', String(on));
    const ctl = toggle.closest('.ctl');
    if (ctl.dataset.act === 'pin') setPinned(on);
    else notify(nameOf(ctl), on ? 'Enabled. The callback ran once.' : 'Disabled. The callback ran once.');
    return;
  }

  const stepButton = target.closest('.st button');
  if (stepButton) {
    const ctl = stepButton.closest('.ctl');
    const step = +ctl.dataset.step;
    const next = snap(clamp(+ctl.dataset.value + step * +stepButton.dataset.dir, +ctl.dataset.min, +ctl.dataset.max), step);
    ctl.dataset.value = next;
    paint(ctl);
    return;
  }

  const trigger = target.closest('.dd-trigger');
  if (trigger) {
    const dd = trigger.closest('.dd');
    const willOpen = !dd.classList.contains('open');
    closeDropdowns(dd);
    dd.classList.toggle('open', willOpen);
    const menu = dd.querySelector('.dd-menu');
    menu.classList.toggle('hidden', !willOpen);
    if (willOpen) {
      const space = innerHeight - trigger.getBoundingClientRect().bottom;
      menu.classList.toggle('up', space < menu.offsetHeight + 24);
      dd.querySelector('.dd-filter').focus();
    }
    return;
  }

  const option = target.closest('.dd-opt');
  if (option) {
    const dd = option.closest('.dd');
    const ctl = dd.closest('.ctl');
    if (dd.dataset.multi === 'true') {
      option.classList.toggle('on');
    } else {
      dd.querySelectorAll('.dd-opt').forEach(other => other.classList.remove('on'));
      option.classList.add('on');
      closeDropdowns();
    }
    paintDropdown(dd);
    if (ctl.dataset.act === 'theme') applyTheme(option.dataset.value);
    else notify(nameOf(ctl), dd.dataset.multi === 'true'
      ? dd.querySelectorAll('.dd-opt.on').length + ' option(s) selected.'
      : option.dataset.value + ' selected.');
    return;
  }

  const segment = target.closest('.seg button');
  if (segment) {
    segment.parentElement.querySelectorAll('button').forEach(other => other.classList.remove('on'));
    segment.classList.add('on');
    notify(nameOf(segment.closest('.ctl')), segment.textContent + ' selected.');
    return;
  }

  const keybind = target.closest('.kb');
  if (keybind) {
    keybind.textContent = 'Press a key';
    keybind.classList.add('listening');
    const capture = event2 => {
      event2.preventDefault();
      event2.stopPropagation();
      document.removeEventListener('keydown', capture, true);
      keybind.classList.remove('listening');
      const key = event2.key === ' ' ? 'Space' : /^(Escape|Backspace)$/.test(event2.key) ? 'None'
        : event2.key.length === 1 ? event2.key.toUpperCase() : event2.key;
      keybind.textContent = key;
      notify(nameOf(keybind.closest('.ctl')), 'Bound to ' + key + '.');
    };
    document.addEventListener('keydown', capture, true);
    return;
  }

  const swatch = target.closest('.cp-swatch');
  if (swatch) { openPicker(swatch.closest('.cp')); return; }

  const action = target.closest('.act');
  if (action) {
    const label = action.textContent;
    if (label === 'Delete') {
      dialog({ title:'Delete “' + action.dataset.row + '”?', body:'The profile and its saved settings are removed. This cannot be undone.',
        confirmText:'Delete', danger:true, onConfirm:() => notify('Profile deleted', action.dataset.row + ' was removed.') });
    } else {
      notify(label + ' ' + action.dataset.row, 'The row-level callback received the record.');
    }
    return;
  }

  const button = target.closest('.go');
  if (button) {
    const ctl = button.closest('.ctl');
    const name = nameOf(ctl);
    if (ctl.dataset.act === 'confirm') {
      dialog({ title:name + '?', body:'Cancel is the default and the confirm button is tinted as a danger, which is what Window:Confirm gives you.',
        confirmText:name, danger:true, onConfirm:() => notify(name + ' complete', 'The OnConfirm callback ran once.') });
    } else if (ctl.dataset.act === 'progress') {
      const bar = $('#page-dashboard').querySelector('.pg')?.closest('.ctl');
      if (bar) {
        bar.dataset.value = Math.min(+bar.dataset.max, +bar.dataset.value + 63);
        paint(bar);
        if (+bar.dataset.value >= +bar.dataset.max) notify('Scan complete', 'The bar recoloured itself through SetColor.');
      }
    } else {
      notify(name, 'The callback ran successfully.');
    }
  }
});

/* slider drag + keyboard */
function dragSlider(slider, clientX) {
  const ctl = slider.closest('.ctl');
  const rect = slider.getBoundingClientRect();
  const min = +ctl.dataset.min, max = +ctl.dataset.max, step = +ctl.dataset.step;
  const ratio = clamp((clientX - rect.left - 8) / Math.max(1, rect.width - 16), 0, 1);
  ctl.dataset.value = snap(min + ratio * (max - min), step);
  paint(ctl);
}
document.addEventListener('pointerdown', event => {
  const slider = event.target.closest('.sl');
  if (!slider || slider.closest('.ctl.locked')) return;
  slider.setPointerCapture(event.pointerId);
  dragSlider(slider, event.clientX);
  const move = event2 => dragSlider(slider, event2.clientX);
  const stop = () => {
    slider.removeEventListener('pointermove', move);
    slider.removeEventListener('pointerup', stop);
    slider.removeEventListener('pointercancel', stop);
  };
  slider.addEventListener('pointermove', move);
  slider.addEventListener('pointerup', stop);
  slider.addEventListener('pointercancel', stop);
});
document.addEventListener('keydown', event => {
  const slider = document.activeElement?.closest?.('.sl');
  if (!slider || !/^Arrow(Left|Right|Up|Down)$|^(Home|End)$/.test(event.key)) return;
  event.preventDefault();
  const ctl = slider.closest('.ctl');
  const min = +ctl.dataset.min, max = +ctl.dataset.max, step = +ctl.dataset.step;
  const current = +ctl.dataset.value;
  const next = event.key === 'Home' ? min : event.key === 'End' ? max
    : /Left|Down/.test(event.key) ? current - step : current + step;
  ctl.dataset.value = snap(clamp(next, min, max), step);
  paint(ctl);
});

/* dropdown filter */
document.addEventListener('input', event => {
  if (event.target.classList.contains('dd-filter')) {
    const dd = event.target.closest('.dd');
    const query = event.target.value.trim().toLowerCase();
    let shown = 0;
    dd.querySelectorAll('.dd-opt').forEach(option => {
      const match = option.dataset.value.toLowerCase().includes(query);
      option.classList.toggle('hidden', !match);
      if (match) shown++;
    });
    dd.querySelector('.dd-empty').classList.toggle('hidden', shown !== 0);
  }
  if (event.target.matches('textarea.fld')) countLines(event.target);
});

/* colour picker popup */
function openPicker(picker) {
  closePickers(picker);
  if (picker.querySelector('.cp-pop')) { picker.querySelector('.cp-pop').remove(); return; }
  let [hue, saturation, value] = hexToHsv(picker.dataset.value);
  const pop = document.createElement('div');
  pop.className = 'cp-pop';
  pop.innerHTML = '<div class="cp-sv"><span class="cp-dot"></span></div><div class="cp-hue"><span class="cp-dot"></span></div>' +
    '<input class="cp-hex" maxlength="7" aria-label="Hex value">';
  picker.appendChild(pop);
  if (pop.getBoundingClientRect().bottom > innerHeight - 12) pop.classList.add('up');
  const square = pop.querySelector('.cp-sv'), rail = pop.querySelector('.cp-hue'), hex = pop.querySelector('.cp-hex');

  const render = () => {
    const colour = toHex(hsvToRgb(hue, saturation, value));
    square.style.background = 'linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(' + hue + ' 100% 50%))';
    square.querySelector('.cp-dot').style.left = saturation * 100 + '%';
    square.querySelector('.cp-dot').style.top = (1 - value) * 100 + '%';
    rail.querySelector('.cp-dot').style.left = hue / 360 * 100 + '%';
    if (document.activeElement !== hex) hex.value = colour.toUpperCase();
    picker.dataset.value = colour;
    paintSwatch(picker);
  };
  const track = (element, handler) => element.addEventListener('pointerdown', event => {
    element.setPointerCapture(event.pointerId);
    const apply = event2 => { handler(element.getBoundingClientRect(), event2); render(); };
    apply(event);
    const stop = () => { element.removeEventListener('pointermove', apply); element.removeEventListener('pointerup', stop); };
    element.addEventListener('pointermove', apply);
    element.addEventListener('pointerup', stop);
  });
  track(square, (rect, event) => {
    saturation = clamp((event.clientX - rect.left) / rect.width, 0, 1);
    value = 1 - clamp((event.clientY - rect.top) / rect.height, 0, 1);
  });
  track(rail, (rect, event) => { hue = clamp((event.clientX - rect.left) / rect.width, 0, 1) * 360; });
  hex.addEventListener('input', () => {
    if (!/^#?[0-9a-f]{6}$/i.test(hex.value)) return;
    [hue, saturation, value] = hexToHsv(hex.value.startsWith('#') ? hex.value : '#' + hex.value);
    render();
  });
  pop.addEventListener('click', event => event.stopPropagation());
  render();
}

/* ------------------------------- navigation ------------------------------- */
function activate(id) {
  state.tab = id;
  const tab = TABS.find(entry => entry.id === id);
  tabsEl.querySelectorAll('.tab').forEach(button => button.classList.toggle('on', button.dataset.tab === id));
  pagesEl.querySelectorAll('.page').forEach(page => page.classList.toggle('on', page.id === 'page-' + id));
  $('#eyebrow').textContent = 'ARGON / ' + tab.name.toUpperCase();
  $('#title').textContent = tab.name;
  jumpEl.innerHTML = '<b>JUMP TO</b>' + tab.sections.map((section, index) =>
    '<button class="chip" data-target="sec-' + id + '-' + index + '">' + escape(section.name) + '</button>').join('');
  searchEl.value = '';
  runSearch();
  closeDropdowns();
  closePickers();
}

function runSearch() {
  const page = pagesEl.querySelector('.page.on');
  if (!page) return;
  const query = searchEl.value.trim().toLowerCase();
  let shown = 0;
  page.querySelectorAll('.ctl').forEach(ctl => {
    const match = !query || (ctl.dataset.search || '').toLowerCase().includes(query);
    ctl.classList.toggle('hidden', !match);
    if (match) shown++;
  });
  page.querySelectorAll('.row').forEach(row =>
    row.classList.toggle('hidden', !row.querySelector('.ctl:not(.hidden)')));
  page.querySelectorAll('.div,.spacer').forEach(node => node.classList.toggle('hidden', !!query));
  page.querySelectorAll('.section').forEach(section =>
    section.classList.toggle('hidden', !section.querySelector('.ctl:not(.hidden)')));
  page.querySelector('.empty').classList.toggle('hidden', shown !== 0);
  jumpEl.classList.toggle('hidden', !!query);
}
searchEl.addEventListener('input', runSearch);

/* --------------------------------- overlays --------------------------------- */
const OVERLAYS = [
  { id:'players', title:'PLAYER LIST', meta:'4 CONNECTED', icon:'users', top:96, rows:[
    ['AU','Argon User','@argonuser','YOU'], ['NV','Nova','@nova'], ['RX','Rex','@rex'], ['KA','Kael','@kael']
  ]},
  { id:'binds', title:'ACTIVE BINDS', meta:'3 REGISTERED', icon:'keyboard', top:348, binds:[
    ['Pause combat','P'], ['Toggle interface','INS'], ['Player list','O']
  ]}
];

function buildOverlays() {
  OVERLAYS.forEach(spec => {
    const overlay = document.createElement('aside');
    overlay.className = 'ov';
    overlay.style.top = spec.top + 'px';
    overlay.style.right = '18px';
    const body = spec.rows
      ? spec.rows.map(([initials, name, handle, tag]) => '<div class="ov-row"><span class="ov-av">' + initials +
        '</span><div><div class="ov-n">' + name + '</div><div class="ov-s">' + handle + '</div></div>' +
        (tag ? '<span class="ov-tag">' + tag + '</span>' : '<span></span>') + '</div>').join('')
      : spec.binds.map(([name, key]) => '<div class="ov-row bind"><i class="ov-dot"></i><div class="ov-n">' + name +
        '</div><span class="ov-tag">' + key + '</span></div>').join('');
    overlay.innerHTML = '<div class="ov-head"><span class="ov-icon">' + icon(spec.icon) + '</span><div><div class="ov-title">' +
      spec.title + '</div><div class="ov-meta">' + spec.meta + '</div></div><span class="ov-grip">' + icon('grip', 2) +
      '</span></div><div class="ov-body">' + body + '</div>';
    document.querySelector('.stage').appendChild(overlay);
    makeDraggable(overlay, overlay.querySelector('.ov-head'));
  });
}

function makeDraggable(panel, handle) {
  handle.addEventListener('pointerdown', event => {
    if (event.target.closest('button')) return;
    const rect = panel.getBoundingClientRect();
    panel.style.left = rect.left + 'px';
    panel.style.top = rect.top + 'px';
    panel.style.right = 'auto';
    const offsetX = event.clientX - rect.left, offsetY = event.clientY - rect.top;
    handle.setPointerCapture(event.pointerId);
    const move = event2 => {
      panel.style.left = clamp(event2.clientX - offsetX, 6, innerWidth - rect.width - 6) + 'px';
      panel.style.top = clamp(event2.clientY - offsetY, 6, innerHeight - 60) + 'px';
    };
    const stop = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', stop); };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', stop);
  });
}

const overlaysFit = () => !matchMedia('(max-width:1320px)').matches;
function setPinned(pinned, quiet) {
  state.pinned = pinned;
  $('#pinBtn').classList.toggle('on', pinned);
  document.querySelectorAll('.ov').forEach(overlay => overlay.classList.toggle('hidden', !pinned));
  pagesEl.querySelectorAll('.ctl[data-act="pin"] .tg').forEach(toggle => {
    toggle.classList.toggle('on', pinned);
    toggle.setAttribute('aria-checked', String(pinned));
  });
  if (quiet) return;
  if (!overlaysFit()) {
    notify('Overlays hidden', 'This viewport is too narrow to show them beside the window.');
  } else {
    notify(pinned ? 'Overlays pinned' : 'Overlays unpinned',
      pinned ? 'They stay on screen while the window is hidden.' : 'They hide with the main window.');
  }
}

/* -------------------------------- chrome -------------------------------- */
function toggleWindow() {
  state.hidden = !state.hidden;
  winEl.classList.toggle('away', state.hidden);
  if (state.hidden && !state.pinned) document.querySelectorAll('.ov').forEach(o => o.classList.add('hidden'));
  else if (!state.hidden) document.querySelectorAll('.ov').forEach(o => o.classList.toggle('hidden', !state.pinned));
  if (state.hidden) notify('Interface hidden', 'Press Insert to bring it back.');
}
$('#hideBtn').addEventListener('click', toggleWindow);
$('#themeBtn').addEventListener('click', event => { event.stopPropagation(); toggleThemePanel(); });
$('#pinBtn').addEventListener('click', () => setPinned(!state.pinned));
$('#notifyBtn').addEventListener('click', () =>
  notify('Argon UI', 'Notifications pick their accent from the title, so a failure reads red without extra arguments.'));
$('#helpClose').addEventListener('click', () => $('#help').remove());

document.addEventListener('keydown', event => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (event.key === '/' && !typing) { event.preventDefault(); searchEl.focus(); searchEl.select(); return; }
  if (event.key === 'Insert') { event.preventDefault(); toggleWindow(); return; }
  if (event.key === 'Escape') {
    if (openDialogs.length) { openDialogs.pop()(); return; }
    if (themePanel) { closeThemePanel(); return; }
    if (document.querySelector('.dd.open')) { closeDropdowns(); return; }
    if (document.querySelector('.cp-pop')) { closePickers(); return; }
    if (searchEl.value) { searchEl.value = ''; runSearch(); }
  }
});
window.addEventListener('resize', () => {
  closeThemePanel();
  hideTip();
  pagesEl.querySelectorAll('.lock').forEach(fitLock);
});

/* --------------------------------- start --------------------------------- */
build();
buildOverlays();
activate(TABS[0].id);
applyTheme('Argon');
